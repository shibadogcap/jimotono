name: ci

# MINOR-4 (reviews/p1-integration.md): 3OS同一ソース (AGENTS.MD 7.1) をCIで担保する。
# macOSのみで実ビルドされていた問題に対し、ubuntu / macOS / Windows での
# cmake configure (Debug) -> build -> ctest を matrix 化する。
# Linux は gcc と clang の2ジョブ (最低1つ必須の条件を満たしつつ両方検証)。
# マトリクス拡張: 既存4ジョブ (linux-gcc / linux-clang / macos-clang / windows-msvc) を維持し、
# ubuntu-24.04-arm / macos-14 / macos-13 / windows-11-arm を追加する。
# 現行流儀を踏襲: name/os/cc(/cxx) 指定。Windows (MSVC) ジョブは cc/cxx を持たない。
# 命令セット検証はCI不可: AVX2 / AVX-512 / NEON の実行時正しさ・速度はCIランナーでは検証できない
# (ホストCPUが不定のため)。CIはコンパイル分岐のみ担保し、実行時dispatchはログ出力に留める。

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            name: linux-clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            name: macos-clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            name: windows-msvc
          - os: ubuntu-24.04-arm
            name: linux-arm64-gcc
            cc: gcc
            cxx: g++
          - os: macos-14
            name: macos14-arm64-clang
            cc: clang
            cxx: clang++
          - os: macos-13
            name: macos13-x64-clang
            cc: clang
            cxx: clang++
          - os: windows-11-arm
            name: windows-arm64-msvc

    steps:
      - uses: actions/checkout@v4

      # POSIX (Linux/macOS): Debug を configure 時に指定。
      # CC/CXX は matrix 由来 (gcc / clang)。MSVC ジョブでは使わない。
      - name: Configure (POSIX)
        if: runner.os != 'Windows'
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Debug
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      # Windows (MSVC): 既定ジェネレータ (Visual Studio) を使用。
      # /W4 は CMakeLists.txt 側で付与済みのため追加フラグ不要。
      # Debug は --config で build/test 時に選択 (単一構成との互換のため)。
      - name: Configure (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build-ci

      - name: Build
        run: cmake --build build-ci --config Debug

      - name: Test
        run: ctest --test-dir build-ci -C Debug --output-on-failure
